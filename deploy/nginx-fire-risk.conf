# fire-risk.example.com — 화재위험 예측 서비스
# 호스트에 직접 설치한 Nginx 를 사용한다. 컨테이너를 쓰지 않는다 (Intent-Plan.md 절대규칙).
#
# 설치:
#   sudo cp deploy/nginx-fire-risk.conf /etc/nginx/sites-available/fire-risk
#   sudo ln -s /etc/nginx/sites-available/fire-risk /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d fire-risk.example.com
#   sudo nginx -t && sudo systemctl reload nginx

upstream fire_backend  { server 127.0.0.1:9522; keepalive 16; }
upstream fire_frontend { server 127.0.0.1:9502; keepalive 16; }

server {
    listen 80;
    listen [::]:80;
    server_name fire-risk.example.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name fire-risk.example.com;

    ssl_certificate     /etc/letsencrypt/live/fire-risk.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fire-risk.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    access_log /var/log/nginx/fire-risk.access.log;
    error_log  /var/log/nginx/fire-risk.error.log;

    client_max_body_size 4m;
    gzip on;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;
    gzip_min_length 1024;

    # --- API → Node/Express :9522 ---
    location /api/ {
        proxy_pass         http://fire_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        # 검증 이력 조회는 응답이 크다 (수만 행)
        proxy_read_timeout 120s;
        proxy_buffering    on;
        proxy_buffers      16 32k;
    }

    # --- 정적 자산: 해시 파일명이므로 장기 캐시 ---
    location /assets/ {
        proxy_pass       http://fire_frontend;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # --- 그 외 → Vite preview :9502 (SPA 폴백 포함) ---
    location / {
        proxy_pass         http://fire_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;   # dev 모드 HMR
        proxy_set_header   Connection        "upgrade";
    }
}
