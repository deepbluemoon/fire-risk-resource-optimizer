<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- 상단 막대의 로고와 같은 소방모자. 챙이 앞으로 길고 뒤가 늘어진 실루엣.
       원본은 24×24 안에서 아래쪽에 치우쳐 있어 탭에서 16px 로 줄면 알아보기
       어렵다. 가운데로 옮기고 1.25 배 키워 정사각 안을 채운다.
       색은 App.vue 의 위험 최고등급 색·대비색과 같은 값이다.
       (XML 주석에는 하이픈 두 개를 넣을 수 없어 토큰 이름은 적지 않는다.) -->
  <style>
    .shell, .brim { fill: #da1e28; }
    .crest { stroke: #ffffff; stroke-width: 1.4; stroke-linecap: round; fill: none; }
    .badge { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .shell, .brim { fill: #fa4d56; }
      .crest { stroke: #161616; }
      .badge { fill: #161616; }
    }
  </style>
  <g transform="translate(12 12) scale(1.25) translate(-12 -13.4)">
    <path class="shell" d="M5.4 15.2a6.6 6.6 0 0 1 13.2 0z" />
    <path class="crest" d="M12 8.6v6.6" />
    <path class="brim" d="M2.6 15.2h18.8c.5 0 .8.5.6.9-.7 1.3-2.3 2.1-4.2 2.1H6.2c-1.9 0-3.5-.8-4.2-2.1-.2-.4.1-.9.6-.9z" />
    <circle class="badge" cx="12" cy="12" r="1.5" />
  </g>
</svg>
